infer:
  batch_size: 32
  stride: 256                 # 50% overlap; required by the stitcher (ADR-004)
  min_tissue: 0.02
  tta: false
  heat_downsample: 8          # 2.0 um/px heatmap (ADR-009)
  sigma_divisor: 8.0
  chunk: 1024
postproc:
  # Filter by major axis, matching how evaluation measures lesions.
  # 100 um is well below the 275 um ITC/evaluable boundary, so nothing
  # scorable is ever removed.
  min_lesion_axis_um: 100.0
  min_lesion_mm2: 0.0        # optional secondary area filter; 0 disables
  opening_um: 10.0
  fill_holes: true
eval:
  froc_points: [0.25, 0.5, 1.0, 2.0, 4.0, 8.0]
  bootstrap_n: 1000
